[package]
name = "ori-native-gtk4"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
layer-shell  = ["dep:gtk4-layer-shell"]
session-lock = ["dep:gtk4-session-lock"]

[dependencies]
ori-native-core = { workspace = true }

ori     = { workspace = true }
tracing = { workspace = true }

gtk4  = "0.11"
gdk4  = "0.11"
gsk4  = "0.11"
glib  = "0.22"
gio   = "0.22"
pango = "0.22"

[dependencies.librsvg]
package = "librsvg-rebind"
version = "0.3"

[dependencies.graphene]
package = "graphene-rs"
version = "0.22"

[dependencies.tokio]
workspace = true
features  = ["sync", "rt-multi-thread"]

[dependencies.gtk4-layer-shell]
version  = "0.8.0"
optional = true

[dependencies.gtk4-session-lock]
version  = "0.4"
features = ["v1_1"]
optional = true

[dependencies.tracing-subscriber]
workspace = true
features = ["fmt", "env-filter"]
