[package]
name = "ori-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[workspace]
members = [
  "core",
  "platform/*",
  "examples/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ori Developers"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ori-native      = { path = "."    }
ori-native-core = { path = "core" }

ori-native-android = { path = "platform/android" }
ori-native-gtk4    = { path = "platform/gtk4"    }

ori = { git = "https://github.com/ori-ui/ori" }

taffy   = "0.9"
tokio   = "1"
tracing = "0.1"
seahash = "4"

keyboard-types = "0.8"

[features]
layer-shell  = ["ori-native-gtk4/layer-shell"]
session-lock = ["ori-native-gtk4/session-lock"]

[dependencies]
ori-native-core = { workspace = true }
ori-native-gtk4 = { workspace = true }
ori             = { workspace = true }
tokio           = { workspace = true }
